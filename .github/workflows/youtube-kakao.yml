name: YouTube to KakaoTalk

on:
  # 스케줄 비활성화: Gemini API 키의 사용량 한도가 사실상 0으로 보여
  # (계정에 있는 모델 3개 모두 429) 매일 자동 실행을 잠시 멈춰 둔다.
  # 한도 확인/조치 후 아래 schedule 블록 주석을 풀면 다시 켤 수 있다.
  # schedule:
  #   # 매일 22:00 UTC = 한국 시간 다음날 오전 7시.
  #   # 전날 저녁에 올라온 영상을 아침에 한 번 확인한다.
  #   - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "이미 보낸 영상이어도 최신 영상을 다시 처리"
        type: boolean
        default: false
      drafts_only:
        description: "카카오톡은 보내지 않고 티스토리 원고만 다시 생성"
        type: boolean
        default: false

# 같은 시간에 두 번 돌면서 상태 파일이 충돌하지 않도록
concurrency:
  group: youtube-kakao
  cancel-in-progress: false

env:
  YOUTUBE_CHANNEL_ID: UCC3yfxS5qC6PCwDzetUuEWg
  YOUTUBE_HANDLE: sosumonkey
  YOUTUBE_CHANNEL_NAME: 소수몽키

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check latest video (and send to KakaoTalk unless drafts_only)
        env:
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_FORCE: ${{ inputs.force }}
          YOUTUBE_SKIP_KAKAO: ${{ inputs.drafts_only }}
        run: python3 .github/scripts/youtube_kakao.py

      - name: Build Tistory drafts from new videos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/scripts/tistory_post.py

      - name: Commit state and drafts
        # 원고 생성이 실패해도 카톡은 이미 나갔으므로 상태는 반드시 기록한다.
        if: always()
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "유튜브 새 영상 알림 및 티스토리 자료 생성"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push 실패, 재시도 ${i}"
            sleep $((2 ** i))
          done
          exit 1
