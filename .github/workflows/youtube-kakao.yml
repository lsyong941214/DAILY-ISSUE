name: YouTube to KakaoTalk

on:
  schedule:
    # 매일 22:00 UTC = 한국 시간 다음날 오전 7시.
    # 전날 저녁에 올라온 영상을 아침에 한 번 확인한다.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "이미 보낸 영상이어도 최신 영상을 다시 처리"
        type: boolean
        default: false

# 같은 시간에 두 번 돌면서 상태 파일이 충돌하지 않도록
concurrency:
  group: youtube-kakao
  cancel-in-progress: false

env:
  YOUTUBE_CHANNEL_ID: UCC3yfxS5qC6PCwDzetUuEWg
  YOUTUBE_HANDLE: sosumonkey
  YOUTUBE_CHANNEL_NAME: 소수몽키

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check latest video and send to KakaoTalk
        env:
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_FORCE: ${{ inputs.force }}
        run: python3 .github/scripts/youtube_kakao.py

      - name: Build Tistory drafts from new videos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/scripts/tistory_post.py

      - name: Commit state and drafts
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "유튜브 새 영상 알림 및 티스토리 자료 생성"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push 실패, 재시도 ${i}"
            sleep $((2 ** i))
          done
          exit 1
